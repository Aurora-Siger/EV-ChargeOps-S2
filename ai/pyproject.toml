[project]
name = "evchargeops-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langchain-postgres>=0.0.12",
  "langgraph>=0.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.uv]
# Projeto "virtual": o uv instala só as dependências, não empacota o app.
# Deixa explícito o que o Dockerfile assume (`uv sync --no-install-project`).
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Sem isso, "app" não é encontrado: tests/ não tem __init__.py, então o pytest só
# adiciona tests/ ao sys.path, não a raiz do projeto (ai/). Roda igual local/Docker/CI.
pythonpath = ["."]
